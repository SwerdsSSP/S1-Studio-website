services:
  - type: web
    name: s1-studio
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: s1-studio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
